name: Sozu sideload APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SETUP_JAVA_VERSION: 21.0.11+10.0.LTS

jobs:
  apk:
    name: Sign and publish Sozu APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pinned JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.SETUP_JAVA_VERSION }}

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Sign with the Sozu key
        env:
          SOZU_STORE_B64: ${{ secrets.SOZU_STORE_B64 }}
          SOZU_STORE_PASS: ${{ secrets.SOZU_STORE_PASS }}
        run: |
          set -euo pipefail
          test -n "$SOZU_STORE_B64"
          printf '%s' "$SOZU_STORE_B64" | base64 -d > "$RUNNER_TEMP/sozu.p12"
          APK=$(ls app/build/outputs/apk/debug/*universal*.apk | head -1)
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/sozu.p12" --ks-key-alias sozu --ks-pass "pass:$SOZU_STORE_PASS" --out sozu-offline-pay.apk "$APK"
          "$APKSIGNER" verify --verbose sozu-offline-pay.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="sozu-apk-0.1.2"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "${{ github.sha }}" --title "Sozu offline pay 0.1.2" --notes "Cheques name the testnet vault CDSCQSVWKTYR7EUJK5EQXIFI4L2C4LCPQOIUYP6PMG6KW4O2BZGCRLLV. Tap a person, enter an amount, confirm with your passkey."
          gh release upload "$tag" sozu-offline-pay.apk --clobber
